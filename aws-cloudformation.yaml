AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation Template for Launchcloud Klass - RDS, S3, Lambda and API Gateway (serverless)'

Parameters:
  DBName:
    Type: String
    Default: klass
    Description: The database name
  DBUsername:
    Type: String
    Default: admin
    Description: The database admin account username
  DBPassword:
    Type: String
    NoEcho: true
    Description: The database admin account password
    MinLength: 8
  AppS3Bucket:
    Type: String
    Description: "Nome do bucket S3 onde o zip do app foi enviado"
  AppS3Key:
    Type: String
    Default: klass-lambda.zip
    Description: Chave do arquivo zip no bucket de deploy
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0cc6a0e0aabf4cdf9
    Description: VPC onde o RDS sera criado
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: "subnet-0e50279d1034d1c43,subnet-067f1e35d87b2659b,subnet-0a48c2c09a9ecbfad"
    Description: Subnets do VPC para o RDS (minimo 2 AZs)

Resources:
  # Security Group para o RDS
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL access from anywhere
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0

  # Subnet Group para o RDS
  KlassDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Klass RDS
      SubnetIds: !Ref SubnetIds

  # RDS Database Instance
  KlassDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBName: !Ref DBName
      AllocatedStorage: 20
      DBInstanceClass: db.t3.micro
      Engine: mysql
      EngineVersion: "8.0"
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      PubliclyAccessible: true
      DBSubnetGroupName: !Ref KlassDBSubnetGroup
      VPCSecurityGroups:
        - !GetAtt RDSSecurityGroup.GroupId

  # S3 Bucket para materiais, certificados, telemetria e respostas
  KlassBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "klass-materials-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
            AllowedOrigins:
              - "*"
            ExposeHeaders:
              - ETag

  # Lambda principal: roda o Express via serverless-http
  KlassAppLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: klass-app
      Handler: dist/lambda.handler
      Role: arn:aws:iam::278746617329:role/ibmec/service-roles/ibmec-e87072cc-660fe9-lambda-role
      Code:
        S3Bucket: !Ref AppS3Bucket
        S3Key: !Ref AppS3Key
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          DB_HOST: !GetAtt KlassDB.Endpoint.Address
          DB_PORT: "3306"
          DB_USER: !Ref DBUsername
          DB_PASSWORD: !Ref DBPassword
          DB_NAME: !Ref DBName
          S3_BUCKET_NAME: !Sub "klass-materials-${AWS::AccountId}"
          LAMBDA_CERTIFICATE_FUNCTION: !Ref CertificatesLambda

  # Lambda de certificados (placeholder)
  CertificatesLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: klass-generate-certificate
      Handler: index.handler
      Role: arn:aws:iam::278746617329:role/ibmec/service-roles/ibmec-e87072cc-660fe9-lambda-role
      Code:
        ZipFile: |
          exports.handler = async (event) => {
              return {
                  statusCode: 200,
                  body: JSON.stringify('Lambda placeholder de certificados'),
              };
          };
      Runtime: nodejs20.x
      Timeout: 30

  # Permissao para o API Gateway invocar a Lambda
  ApiGatewayLambdaPermission:
    Type: AWS::Lambda::Permission
    DependsOn: KlassAppLambda
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt KlassAppLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${KlassHttpApi}/*"

  # API Gateway HTTP API v2
  KlassHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: klass-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"
        MaxAge: 300

  # Integracao Lambda Proxy
  KlassApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref KlassHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${KlassAppLambda.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  # Rota padrao: captura qualquer path e metodo
  KlassApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref KlassHttpApi
      RouteKey: "$default"
      Target: !Sub "integrations/${KlassApiIntegration}"

  # Stage com auto-deploy
  KlassApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref KlassHttpApi
      StageName: "$default"
      AutoDeploy: true

Outputs:
  ApiGatewayUrl:
    Description: URL publica do API Gateway
    Value: !Sub "https://${KlassHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  RDSAddress:
    Description: Endpoint do banco de dados RDS
    Value: !GetAtt KlassDB.Endpoint.Address
  S3BucketName:
    Description: Nome do Bucket S3
    Value: !Ref KlassBucket
  CertificateLambdaName:
    Description: Nome da Lambda de certificados
    Value: !Ref CertificatesLambda
