AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation Template for Launchcloud Klass - RDS, S3, Lambda and API Gateway (serverless)'

Parameters:
  DBName:
    Type: String
    Default: klass
    Description: The database name
  DBUsername:
    Type: String
    Default: admin
    Description: The database admin account username
  DBPassword:
    Type: String
    NoEcho: true
    Description: The database admin account password
    MinLength: 8
  AppS3Bucket:
    Type: String
    Description: Nome do bucket S3 onde o zip do app foi enviado (ex: meu-bucket-deploy)
  AppS3Key:
    Type: String
    Default: launchcloud-klass.zip
    Description: Chave do arquivo zip no bucket de deploy

Resources:
  # Security Group para o RDS (acesso publico em dev)
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0

  # RDS Database Instance
  KlassDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBName: !Ref DBName
      AllocatedStorage: 20
      DBInstanceClass: db.t3.micro
      Engine: mysql
      EngineVersion: "8.0"
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      PubliclyAccessible: true
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup

  # S3 Bucket para materiais, certificados e uploads
  KlassBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "klass-materials-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
            AllowedOrigins:
              - "*"
            ExposeHeaders:
              - ETag

  # IAM Role compartilhada pelas duas Lambdas
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess

  # Lambda principal: roda o Express inteiro via serverless-http
  KlassAppLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: klass-app
      Handler: dist/lambda.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref AppS3Bucket
        S3Key: !Ref AppS3Key
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          DB_HOST: !GetAtt KlassDB.Endpoint.Address
          DB_PORT: "3306"
          DB_USER: !Ref DBUsername
          DB_PASSWORD: !Ref DBPassword
          DB_NAME: !Ref DBName
          S3_BUCKET_NAME: !Sub "klass-materials-${AWS::AccountId}"
          LAMBDA_CERTIFICATE_FUNCTION: !Ref CertificatesLambda

  # Lambda de certificados: gera PDF e salva no S3
  CertificatesLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: klass-generate-certificate
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          exports.handler = async (event) => {
              return {
                  statusCode: 200,
                  body: JSON.stringify('Lambda placeholder — substitua pelo codigo real de geracao de PDF'),
              };
          };
      Runtime: nodejs20.x
      Timeout: 30

  # Permissao para o API Gateway invocar a Lambda do app
  ApiGatewayLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt KlassAppLambda.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${KlassHttpApi}/*"

  # API Gateway HTTP API (v2)
  KlassHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: klass-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - "*"
        MaxAge: 300

  # Integracao Lambda Proxy: API Gateway -> KlassAppLambda
  KlassApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref KlassHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${KlassAppLambda.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  # Rota padrao: captura qualquer path e metodo
  KlassApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref KlassHttpApi
      RouteKey: "$default"
      Target: !Sub "integrations/${KlassApiIntegration}"

  # Stage com auto-deploy
  KlassApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref KlassHttpApi
      StageName: "$default"
      AutoDeploy: true

Outputs:
  ApiGatewayUrl:
    Description: URL publica do API Gateway — use esta em todos os endpoints e no Swagger
    Value: !Sub "https://${KlassHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  RDSAddress:
    Description: Endpoint do banco de dados RDS
    Value: !GetAtt KlassDB.Endpoint.Address
  S3BucketName:
    Description: Nome do Bucket S3 para materiais e certificados
    Value: !Ref KlassBucket
  CertificateLambdaName:
    Description: Nome da Lambda de certificados
    Value: !Ref CertificatesLambda
